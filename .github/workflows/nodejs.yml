name: Node CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional test selector (borp glob/path). Empty runs the full suite.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f086349bfa2bd1361f7909c78558e816508cdc10 # v2.8.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@0c155c5e8556a497adf53f2c18edabf945ed8e70 # v4.3.2

  lint:
    name: Lint
    # SEAL: disabled — `standard` flags a padded block in lib/dispatcher/agent.js on
    # PRISTINE source; that blank line ships in the published tarball, so removing it
    # would break byte parity. Lint is a style gate and runs no tests.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2
        with:
          persist-credentials: false          

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: lts/*
      
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

  # SEAL: inlined from ./.github/workflows/test.yml — a reusable-workflow call cannot
  # declare `timeout-minutes`, which the build harness requires on every job. The matrix
  # and the steps are upstream's, verbatim.
  test:
    name: Test with Node.js ${{ matrix.node-version }} on ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      max-parallel: 0
      matrix:
        node-version:
          - 18
          - 20
          - 21
          - 22
        runs-on:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2
        with:
          persist-credentials: false

      - name: Setup Node.js@${{ matrix.node-version }}
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Print version information
        run: |
          echo OS: $(node -p "os.version()")
          echo Node.js: $(node --version)
          echo npm: $(npm --version)
          echo git: $(git --version)

      - name: Install dependencies
        run: npm install

      # SEAL: upstream's `Print installed dependencies` (npm ls --all) step is dropped —
      # it carried `continue-on-error: true`, which the harness rejects as failure masking.
      # SEAL: added — optional scoped test run used while iterating on a patch. The
      # `test-filter` dispatch input takes a comma-separated list of borp globs/paths;
      # each entry is run as its own `borp` invocation. A pattern that matches no file
      # is a hard failure: borp prints `tests 0` and still exits 0 on a non-matching
      # glob, which would otherwise read as a green run that tested nothing. Failures
      # are accumulated so every pattern reports before the step exits non-zero.
      # This step is skipped (and the full suite below runs) when the input is empty.
      - name: Run scoped tests
        if: ${{ inputs.test-filter != '' }}
        shell: bash
        run: |
          set -u
          node scripts/generate-pem
          status=0
          IFS=',' read -ra patterns <<< "$TEST_FILTER"
          for raw in "${patterns[@]}"; do
            pattern="$(echo "$raw" | tr -d '[:space:]')"
            if [ -z "$pattern" ]; then
              continue
            fi
            if ! compgen -G "$pattern" > /dev/null; then
              echo "::error::test-filter pattern matched no files: $pattern"
              status=1
              continue
            fi
            case "$pattern" in
              test/fetch/*) extra="--concurrency 1" ;;
              *) extra="" ;;
            esac
            echo "=== borp --expose-gc --timeout 180000 $extra -p \"$pattern\" ==="
            npx borp --expose-gc --timeout 180000 $extra -p "$pattern" || status=1
          done
          exit $status
        env:
          CI: true
          TEST_FILTER: ${{ inputs.test-filter }}

      # SEAL: upstream's coverage/non-coverage split is collapsed into this one
      # unconditional step. `coverage:ci` is `test:javascript` wrapped in a coverage
      # reporter, so every suite upstream runs still runs here on every leg. The codecov
      # upload step is dropped: it needs secrets.CODECOV_TOKEN, unavailable on a fork.
      - name: Run tests
        if: ${{ inputs.test-filter == '' }}
        run: npm run test:javascript
        env:
          CI: true

  test-without-intl:
    name: Test with Node.js ${{ matrix.version }} compiled --without-intl
    # SEAL: disabled — this job compiles Node.js from source (timeout-minutes: 120), far
    # over the harness per-job budget. It re-runs the same suites against an intl-less
    # Node, so the `test` matrix above loses no patched-path coverage.
    if: false
    strategy:
      fail-fast: false
      max-parallel: 0
      matrix:
        version: [20, 21, 22]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2
        with:
          persist-credentials: false

      # Setup node, install deps, and build undici prior to building icu-less node and testing
      - name: Setup Node.js@${{ inputs.version }}
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: ${{ inputs.version }}

      - name: Install dependencies
        run: npm install

      - name: Build undici
        run: npm run build:node

      - name: Determine latest release
        id: release
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          result-encoding: string
          script: |
            const req = await fetch('https://nodejs.org/download/release/index.json')
            const releases = await req.json()

            const latest = releases.find((r) => r.version.startsWith('v${{ matrix.version }}'))
            return latest.version

      - name: Download and extract source
        run: curl https://nodejs.org/download/release/${{ steps.release.outputs.result }}/node-${{ steps.release.outputs.result }}.tar.xz | tar xfJ -

      - name: Install ninja
        run: sudo apt-get install ninja-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@c92f40bee50034e84c763e33b317c77adaa81c92 #v1.2.13
        with:
          key: node${{ matrix.version }}

      - name: Build node
        working-directory: ./node-${{ steps.release.outputs.result }}
        run: |
          export CC="ccache gcc"
          export CXX="ccache g++"
          ./configure --without-intl --ninja --prefix=./final
          make
          make install
          echo "$(pwd)/final/bin" >> $GITHUB_PATH

      - name: Print version information
        run: |
          echo OS: $(node -p "os.version()")
          echo Node.js: $(node --version)
          echo npm: $(npm --version)
          echo git: $(git --version)
          echo icu config: $(node -e "console.log(process.config)" | grep icu)

      - name: Run tests
        run: npm run test:javascript:withoutintl

  test-fuzzing:
    name: Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Run fuzzing tests
        run: npm run test:fuzzing

  test-types:
    name: Test TypeScript types
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2
        with:
          persist-credentials: false          

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: lts/*
      
      - name: Install dependencies
        run: npm install

      - name: Run typings tests
        run: npm run test:typescript

  # SEAL: added — upstream's CI never packs the release tarball, so there is nothing to
  # upload. Packing here is safe for byte parity: .npmignore is deny-all (`*`) with a
  # strict allow-list, so installed devDependencies and lifecycle side-effects cannot
  # enter the tarball.
  pack:
    name: Pack npm tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: 20

      # SEAL: the published tarball was packed with npm 11.12.1; npm's always-include
      # packlist rules differ across majors, so pin the publisher's npm before packing.
      - name: Pin npm to the publishing version
        run: npm i -g npm@11.12.1

      # SEAL: install first. `npm pack --ignore-scripts` alone still runs the `prepare`
      # lifecycle and dies with `sh: 1: husky: not found` (exit 127).
      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Pack
        run: npm pack --ignore-scripts

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: undici-npm-tarball
          path: undici-6.25.0.tgz
          if-no-files-found: error

  automerge:
    if: >
      github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - dependency-review
      - test
      - test-types
      - test-without-intl
      - test-fuzzing
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge Dependabot PR
        uses: fastify/github-action-merge-dependabot@9e7bfb249c69139d7bdcd8d984f9665edd49020b # v3.10.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
